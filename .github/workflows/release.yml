name: Release module
on:
  push:
    tags:
      - "places.*@*"
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate module and version
        id: release
        run: node scripts/release.mjs --check-tag "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
      - run: pnpm --filter "./${{ steps.release.outputs.directory }}" typecheck
      - run: pnpm --filter "./${{ steps.release.outputs.directory }}" --if-present test
      - run: pnpm --filter "./${{ steps.release.outputs.directory }}" build
      - name: Publish module packages
        env:
          GH_TOKEN: ${{ github.token }}
          MODULE: ${{ steps.release.outputs.module }}
          VERSION: ${{ steps.release.outputs.version }}
          DIRECTORY: ${{ steps.release.outputs.directory }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$DIRECTORY/dist/$MODULE-$VERSION.placard-module" \
            "$DIRECTORY/dist/$MODULE-$VERSION.zip" \
            --verify-tag --title "$MODULE $VERSION" \
            --notes "Install in Placard: https://github.com/$GITHUB_REPOSITORY#$MODULE"
